<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1117'/%3E%3Crect x='6' y='6' width='9' height='9' fill='%2322d3ee'/%3E%3Crect x='17' y='6' width='9' height='9' fill='%23a855f7'/%3E%3Crect x='6' y='17' width='9' height='9' fill='%23facc15'/%3E%3Crect x='17' y='17' width='9' height='9' fill='%2322c55e'/%3E%3C/svg%3E" />
    <title>Block Drop</title>
  </head>
  <body>
    <div id="app">
      <main id="stage">
        <canvas id="board"></canvas>

        <aside id="panel">
          <div class="preview">
            <h2>NEXT</h2>
            <canvas id="next"></canvas>
          </div>
          <div class="preview">
            <h2>HOLD</h2>
            <canvas id="hold"></canvas>
          </div>
          <dl id="stats">
            <dt>SCORE</dt><dd id="score">0</dd>
            <dt>BEST</dt><dd id="best">0</dd>
            <dt>LINES</dt><dd id="lines">0</dd>
            <dt>LEVEL</dt><dd id="level">1</dd>
          </dl>
          <div id="controls">
            <button id="btn-hold" type="button">HOLD</button>
            <button id="btn-pause" type="button">PAUSE</button>
            <button id="btn-restart" type="button">RESTART</button>
          </div>
        </aside>
      </main>

      <div id="overlay" hidden>
        <p id="overlay-title"></p>
        <p id="overlay-hint"></p>
      </div>

      <p id="keyhelp">
        ← → 移動 ／ ↑ 回転 ／ Z 左回転 ／ ↓ ソフトドロップ ／ Space ハードドロップ ／ C ホールド ／ P ポーズ ／ R リスタート
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
