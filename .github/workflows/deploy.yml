# main への push で GitHub Pages を更新する。
#
# ビルド成果物（dist/）をリポジトリにコミットしない方針なので、
# Actions 側でビルドして Pages に直接アップロードする。
# こうしておくと「ビルドを忘れて古い dist が公開される」という事故が起きない。
# action は commit SHA で固定している。タグは付け替えられるので、上流の
# アカウントが乗っ取られると CI 上で任意コードが走る余地が残る。
# 更新は Dependabot（.github/dependabot.yml）が PR で提案してくる。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動でも実行できるようにしておく（Pages の設定を変えた直後の確認に要る）
  workflow_dispatch:

# 既定は読み取りのみ。書き込み権限は必要なジョブにだけ与える。
# ここに pages: write と id-token: write を置くと、コードを取得して
# ビルドするだけのジョブにも公開権限が付いてしまう。
permissions:
  contents: read

# 公開は1つずつ。走行中のデプロイは止めない（中断すると中途半端な状態で公開されうる）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 型チェックとテストを通してから公開する。
      # 壊れたものが公開URLに出るほうが、デプロイが失敗するより困る。
      - run: pnpm typecheck
      - run: pnpm test

      - run: pnpm build

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 公開に必要な権限はこのジョブにだけ与える。コードの取得はしない。
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
